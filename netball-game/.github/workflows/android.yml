name: Netball Unleashed · Android build

# For the game in its own repository (this folder at the root): builds the beta APK you can sideload,
# after running the headless test suite.

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_DIR: "."

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # to publish the beta release (below)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Put Godot on PATH
        run: |
          ln -sf ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version --headless

      - name: Build translations
        run: python3 ${PROJECT_DIR}/tools/build_i18n.py

      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Compile check
        working-directory: ${{ env.PROJECT_DIR }}
        run: godot --headless --path . res://tests/compile_check.tscn

      - name: Rules and smoke test (every rule, screens in every language, the cup, AI matches, movement)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # A script error does not stop Godot or fail a check, so the log is read for them too.
          set -o pipefail
          timeout 1500 godot --headless --path . --fixed-fps 30 res://tests/test_runner.tscn 2>&1 | tee test_runner.log
          if grep -q "SCRIPT ERROR" test_runner.log; then grep -A4 "SCRIPT ERROR" test_runner.log; exit 1; fi

      - name: Text fit (every screen, every language, four screen shapes)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          timeout 1500 godot --headless --path . --fixed-fps 30 res://tests/fit_audit.tscn -- fit_audit.jsonl 2>&1 | tee fit.log | tail -25
          if grep -q "SCRIPT ERROR" fit.log; then grep -A4 "SCRIPT ERROR" fit.log; exit 1; fi

      - name: Touch input (scrolling from anywhere on a page, taps)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          timeout 300 xvfb-run -a godot --path . --rendering-driver opengl3 res://tests/input_test.tscn

      - name: Configure Android export
        run: |
          KEYSTORE=$HOME/debug.keystore
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          SETTINGS=~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
          mkdir -p ~/.config/godot
          # Let the editor create its settings file, then point it at the runner's SDK and JDK.
          godot --headless --editor --quit --path ${PROJECT_DIR} || true
          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          sed -i '/export\/android\//d' "$SETTINGS"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$KEYSTORE\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"
          grep android "$SETTINGS"

      - name: Export APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          VERSION=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The same build as the beta APKs sent in the chat: release, 64-bit ARM only, signed in the next step.
          sed -i 's/architectures\/armeabi-v7a=true/architectures\/armeabi-v7a=false/; s/package\/signed=true/package\/signed=false/' export_presets.cfg
          mkdir -p build
          godot --headless --path . --export-release "Android" build/unsigned.apk
          ls -la build

      # Signed with uber-apk-signer's built-in debug key, the key the chat APKs use, so either installs over
      # the other and keeps the player's saves.
      - name: Sign APK
        run: |
          curl -sSL -o ~/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar ~/uber-apk-signer.jar --apks ${PROJECT_DIR}/build/unsigned.apk --out ${PROJECT_DIR}/build/signed
          mv ${PROJECT_DIR}/build/signed/unsigned-aligned-debugSigned.apk ${PROJECT_DIR}/build/netball-unleashed-${VERSION}.apk
          ls -la ${PROJECT_DIR}/build
          python3 ${PROJECT_DIR}/tools/check_pages.py ${PROJECT_DIR}/build/netball-unleashed-${VERSION}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: netball-unleashed-${{ env.VERSION }}-apk
          path: ${{ env.PROJECT_DIR }}/build/netball-unleashed-${{ env.VERSION }}.apk
          if-no-files-found: error

      # A release page with the APK, to download straight onto a phone (the repository is public, so no sign-in):
      # "netball-unleashed-beta", always the latest build of this branch, made afresh on every push that passes the
      # tests. Pull request runs build the same APK and leave the release alone.
      - name: Publish the beta release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=netball-unleashed-beta
          APK=${PROJECT_DIR}/build/netball-unleashed-${VERSION}.apk
          cat > notes.md <<EOF
          The latest beta of **Netball Unleashed** (${VERSION}), built from \`${GITHUB_SHA::7}\` after the full test suite passed.

          **Android** (64-bit phones): tap \`netball-unleashed-${VERSION}.apk\` under Assets below. When it has
          downloaded, open it; if Android asks, allow your browser or Files to install unknown apps. It installs over
          any earlier Netball Unleashed beta and keeps your saves.

          This release is replaced by every new beta build: this page always has the newest one.
          EOF
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Netball Unleashed ${VERSION} (latest beta)" --notes-file notes.md
          gh release view "$TAG"
