name: Pok Ta Pok Rivals · Media kit

# Renders the media kit for the website from the game as it is now (pok-ta-pok-game/tools/media/make_media_kit.sh):
# twelve screenshots and eighteen menu screens on High, the icons and feature graphic, a ~36 s trailer and a 15 s
# vertical cut recorded with Godot's Movie Maker, the website's copy and CREDITS.txt. It publishes them as
# media-kit-pok-ta-pok-rivals.zip on the release "pok-ta-pok-rivals-media": a prerelease, never marked latest,
# whose title does not start with the game's name, so Obtainium (which follows "Pok Ta Pok Rivals ..." releases)
# ignores it. Without a GPU the runners render on the CPU, so the slow parts (the screenshots, the menus and each
# trailer clip) run side by side, each on its own runner, and a last job puts them together.

on:
  push:
    paths:
      - "pok-ta-pok-game/tools/media/**"
      - ".github/workflows/pok-ta-pok-media-kit.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_DIR: pok-ta-pok-game

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: true
      matrix:
        include:
          - { part: screenshots, keep: media-kit-pok-ta-pok-rivals/screenshots, name: screenshots }
          - { part: menus, keep: media-kit-pok-ta-pok-rivals/menus, name: menus }
          - { part: "clip:menu", keep: work/clips/menu, name: clip-menu }
          - { part: "clip:ritual", keep: work/clips/ritual, name: clip-ritual }
          - { part: "clip:village", keep: work/clips/village, name: clip-village }
          - { part: "clip:dive", keep: work/clips/dive, name: clip-dive }
          - { part: "clip:night", keep: work/clips/night, name: clip-night }
          - { part: "clip:festival", keep: work/clips/festival, name: clip-festival }
          - { part: "clip:ring", keep: work/clips/ring, name: clip-ring }
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Put Godot on PATH, and what the recording needs (a virtual display, Mesa's software OpenGL, ffmpeg)
        run: |
          ln -sf ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version --headless
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 ffmpeg zip
          python3 -c "import PIL" 2>/dev/null || pip install pillow

      - name: Render ${{ matrix.part }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          tools/media/make_media_kit.sh "$RUNNER_TEMP/kit" "${{ matrix.part }}"
          mkdir -p "$RUNNER_TEMP/out/$(dirname "${{ matrix.keep }}")"
          mv "$RUNNER_TEMP/kit/${{ matrix.keep }}" "$RUNNER_TEMP/out/${{ matrix.keep }}"

      - uses: actions/upload-artifact@v4
        with:
          name: media-part-${{ matrix.name }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 3

  assemble:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # to publish the media release
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Put Godot on PATH; ffmpeg and zip
        run: |
          ln -sf ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg zip
          python3 -c "import PIL" 2>/dev/null || pip install pillow

      - uses: actions/download-artifact@v4
        with:
          pattern: media-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/kit

      - name: The trailer, the icons and the zip
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls "$RUNNER_TEMP/kit/media-kit-pok-ta-pok-rivals/screenshots" "$RUNNER_TEMP/kit/media-kit-pok-ta-pok-rivals/menus" "$RUNNER_TEMP/kit/work/clips"
          tools/media/make_media_kit.sh "$RUNNER_TEMP/kit" icons trailer pack

      - name: Publish the media release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=pok-ta-pok-rivals-media
          ZIP="$RUNNER_TEMP/kit/media-kit-pok-ta-pok-rivals.zip"
          SIZE=$(du -m "$ZIP" | cut -f1)
          cat > notes.md <<EOF
          The media kit for **Pok Ta Pok Rivals**, rendered from the game at \`${GITHUB_SHA::7}\`: \`media-kit-pok-ta-pok-rivals.zip\` (${SIZE} MB).

          - \`screenshots/\`: twelve 1920 × 1080 PNGs from the real game on High graphics (the courts at dusk, by day and by torchlight, a dive, the copal offering, a ball through the ring, its replay and the result, the menus).
          - \`menus/\`: every menu screen in English, 1920 × 1080 PNGs.
          - \`icons/\`: the icon at 1024 × 1024 and 512 × 512, and the 1024 × 500 feature graphic.
          - \`trailer/\`: the trailer (1920 × 1080, 30 fps, H.264 and AAC) and a 15 s vertical cut (1080 × 1920), recorded from the game with its own sound.
          - \`text/\`: the website's copy (about, features, facts, the sport, a press blurb).
          - \`CREDITS.txt\`: every outside work in the pictures and the sound, with its licence.

          Not the game: the game's betas are on the release "Pok Ta Pok Rivals … (latest beta)".
          EOF
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$ZIP" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Media kit: Pok Ta Pok Rivals" --notes-file notes.md
          gh release view "$TAG"
