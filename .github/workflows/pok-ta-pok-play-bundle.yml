name: Pok Ta Pok Rivals · Play Store bundle

# Builds the Android App Bundle (.aab) that Google Play takes, with Godot's Gradle build (the beta APK in
# pok-ta-pok-android.yml is built without it). It is signed with your upload key when the repository has the key as
# secrets (pok-ta-pok-game/store/PLAY_STORE.md, "The upload key"):
#   ANDROID_UPLOAD_KEYSTORE_BASE64   the keystore file, base64
#   ANDROID_UPLOAD_KEY_ALIAS         the key's alias (upload)
#   ANDROID_UPLOAD_KEY_PASSWORD      the keystore's and the key's password
# Without them the bundle is built unsigned: proof that the build works, but Play will not take it.
# The bundle is the run's artifact (Actions > this run > Artifacts), kept for 30 days.

on:
  push:
    paths:
      - "pok-ta-pok-game/project.godot"          # a new version
      - "pok-ta-pok-game/export_presets.cfg"
      - ".github/workflows/pok-ta-pok-play-bundle.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_DIR: pok-ta-pok-game

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Put Godot on PATH
        run: |
          ln -sf ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version --headless

      - name: Build translations
        run: python3 ${PROJECT_DIR}/tools/build_i18n.py

      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Point Godot at the runner's Android SDK and Java
        run: |
          SETTINGS=~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
          mkdir -p ~/.config/godot
          godot --headless --editor --quit --path ${PROJECT_DIR} || true
          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          sed -i '/export\/android\//d' "$SETTINGS"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
          } >> "$SETTINGS"
          grep android "$SETTINGS"

      - name: The upload key, if the repository has it
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/upload.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD"
              echo "SIGNED=true"
            } >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::notice::No upload key in the repository's secrets: building an unsigned bundle (see pok-ta-pok-game/store/PLAY_STORE.md)."
          fi

      - name: Export the bundle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          VERSION=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          CODE=$(sed -n 's/^version\/code=\([0-9]*\)$/\1/p' export_presets.cfg | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          # The Android preset, built with Gradle into a bundle (Play serves each phone the 64- or 32-bit build).
          sed -i 's/^gradle_build\/use_gradle_build=false/gradle_build\/use_gradle_build=true/; s/^gradle_build\/export_format=0/gradle_build\/export_format=1/' export_presets.cfg
          # Google Play's target API for new apps and updates from 31 August 2026: 36 (Android 16). Android 7 and up.
          sed -i 's/^gradle_build\/target_sdk=""/gradle_build\/target_sdk="36"/; s/^gradle_build\/min_sdk=""/gradle_build\/min_sdk="24"/' export_presets.cfg
          sed -i "s/^package\/signed=true/package\/signed=${SIGNED}/" export_presets.cfg
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-release "Android" "build/pok-ta-pok-rivals-${VERSION}.aab"
          ls -la build

      - name: Check the bundle (16 KB pages, target API, permissions)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          AAB="build/pok-ta-pok-rivals-${VERSION}.aab"
          test -s "$AAB"
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB" > "$RUNNER_TEMP/manifest.xml"
          grep -o 'android:targetSdkVersion="[0-9]*"\|android:minSdkVersion="[0-9]*"\|android:versionCode="[0-9]*"\|android:versionName="[^"]*"\|android:isGame="[a-z]*"\|android:appCategory="[a-z]*"\|uses-permission android:name="[^"]*"' "$RUNNER_TEMP/manifest.xml" | sort -u
          grep -q 'android:isGame="true"' "$RUNNER_TEMP/manifest.xml"
          grep -q 'android:targetSdkVersion="36"' "$RUNNER_TEMP/manifest.xml"
          # The only permission: vibrate.
          test "$(grep -o 'uses-permission android:name="[^"]*"' "$RUNNER_TEMP/manifest.xml" | grep -v 'VIBRATE' | wc -l)" = "0"
          ! grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/manifest.xml"
          python3 tools/check_pages.py "$AAB"
          # Play's limit: the base module at most 200 MB compressed.
          python3 tools/aab_size.py "$AAB"
          # What a phone gets from Play: the per-device APKs bundletool makes from the bundle (signed here with a
          # throwaway key, only to build them). Their 64-bit native libraries must sit on 16 KB pages: zipalign -P 16.
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -alias t -storepass throwaway -keypass throwaway \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway" >/dev/null 2>&1
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle "$AAB" --output "$RUNNER_TEMP/game.apks" \
            --ks "$RUNNER_TEMP/throwaway.jks" --ks-key-alias t --ks-pass pass:throwaway --key-pass pass:throwaway
          mkdir -p "$RUNNER_TEMP/apks" && unzip -q -o "$RUNNER_TEMP/game.apks" -d "$RUNNER_TEMP/apks"
          ZIPALIGN=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -1)zipalign
          for apk in $(find "$RUNNER_TEMP/apks" -name '*.apk' | sort); do
            if unzip -l "$apk" | grep -q 'lib/arm64-v8a/.*\.so$'; then   # Play's 16 KB rule is for 64-bit
              echo "$(basename $apk): $("$ZIPALIGN" -c -P 16 -v 4 "$apk" | tail -1)"
              "$ZIPALIGN" -c -P 16 -v 4 "$apk" > /dev/null
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pok-ta-pok-rivals-${{ env.VERSION }}-play-${{ env.SIGNED == 'true' && 'signed' || 'unsigned' }}
          path: ${{ env.PROJECT_DIR }}/build/pok-ta-pok-rivals-${{ env.VERSION }}.aab
          if-no-files-found: error
          retention-days: 30
