name: Kabaddi Raid · Android build

# Builds the Godot project in kabaddi-game/ into the beta APK you can sideload,
# after running the headless test suite.

on:
  push:
    paths:
      - "kabaddi-game/**"
      - ".github/workflows/kabaddi-android.yml"
  pull_request:
    paths:
      - "kabaddi-game/**"
      - ".github/workflows/kabaddi-android.yml"
  workflow_dispatch:

# One run per branch: a newer push cancels an older run, so an older build can never publish over a newer one.
concurrency:
  group: kabaddi-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_DIR: kabaddi-game

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # to publish the beta release (below)
    steps:
      - uses: actions/checkout@v4

      - name: Shared foundation up to date? (a warning only)
        run: sh ${{ env.PROJECT_DIR }}/tools/wsg/check_foundation.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Put Godot on PATH
        run: |
          ln -sf ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version --headless

      - name: Build translations
        run: python3 ${PROJECT_DIR}/tools/build_i18n.py

      - name: Licensed animation (the private assets, baked for this build)
        env:
          ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}
        run: sh ${PROJECT_DIR}/tools/wsg/fetch_assets.sh

      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Compile check
        working-directory: ${{ env.PROJECT_DIR }}
        run: godot --headless --path . res://tests/compile_check.tscn

      - name: Smoke test (screens, cup, career, full AI match)
        working-directory: ${{ env.PROJECT_DIR }}
        run: timeout 1500 godot --headless --path . --fixed-fps 30 res://tests/test_runner.tscn

      - name: Configure Android export
        env:
          BETA_KEYSTORE_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
        run: |
          KEYSTORE=$HOME/debug.keystore
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          # The beta key (repo secret BETA_KEYSTORE_B64: a PKCS12 keystore, store and key password "android", alias
          # "androiddebugkey"), the same for every build, so each beta installs over the one before.
          if [ -n "$BETA_KEYSTORE_B64" ]; then
            echo "$BETA_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          else
            echo "::warning::BETA_KEYSTORE_B64 is not set: this APK is signed with a throwaway key, and will not install over earlier builds (uninstall first)."
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          SETTINGS=~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
          mkdir -p ~/.config/godot
          # Let the editor create its settings file, then point it at the runner's SDK and JDK.
          godot --headless --editor --quit --path ${PROJECT_DIR} || true
          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          sed -i '/export\/android\//d' "$SETTINGS"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$KEYSTORE\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"
          grep android "$SETTINGS"

      - name: Export APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          VERSION=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The same build as the beta APKs sent in the chat: release, 64-bit ARM only, signed in the next step.
          sed -i 's/architectures\/armeabi-v7a=true/architectures\/armeabi-v7a=false/; s/package\/signed=true/package\/signed=false/' export_presets.cfg
          mkdir -p build
          godot --headless --path . --export-release "Android" build/unsigned.apk
          ls -la build

      # Signed with the beta key (above), so every beta installs over the last and keeps the player's saves. The job
      # fails if the secret is set and the APK's certificate is not the beta key's.
      - name: Sign APK
        env:
          HAS_BETA_KEY: ${{ secrets.BETA_KEYSTORE_B64 != '' }}
          BETA_SHA256: "6F:23:A9:36:9A:95:60:C5:57:1D:27:04:D2:01:5F:8D:58:3E:B2:65:2E:86:A5:F1:66:2B:E5:D6:C3:69:7B:A3"
        run: |
          curl -sSL -o ~/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar ~/uber-apk-signer.jar --apks ${PROJECT_DIR}/build/unsigned.apk --out ${PROJECT_DIR}/build/signed \
            --ks "$KEYSTORE" --ksAlias androiddebugkey --ksPass android --ksKeyPass android
          mv ${PROJECT_DIR}/build/signed/*.apk ${PROJECT_DIR}/build/kabaddi-raid-${VERSION}.apk
          ls -la ${PROJECT_DIR}/build
          SHA=$(keytool -printcert -jarfile ${PROJECT_DIR}/build/kabaddi-raid-${VERSION}.apk | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          echo "APK signing certificate SHA-256: $SHA"
          if [ "$HAS_BETA_KEY" = "true" ] && [ "$SHA" != "$BETA_SHA256" ]; then
            echo "::error::The APK is not signed with the beta key (expected $BETA_SHA256)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kabaddi-raid-${{ env.VERSION }}-apk
          path: ${{ env.PROJECT_DIR }}/build/kabaddi-raid-${{ env.VERSION }}.apk
          if-no-files-found: error

      # A release page with the APK, to download straight onto a phone (the repository is public, so no sign-in):
      # "kabaddi-raid-beta", always the latest build of this branch, made afresh on every push that passes the
      # tests. Pull request runs build the same APK and leave the release alone.
      - name: Publish the beta release
        # Only the game's own branch publishes the beta: a push from any other branch (a pilot cut from it) would
        # otherwise replace the testers' build.
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/kabaddi-game-concept-asnz07'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=kabaddi-raid-beta
          APK=${PROJECT_DIR}/build/kabaddi-raid-${VERSION}.apk
          # What is new in this version (docs/RELEASE_NOTES.md), when there is something to say.
          NEW=""
          [ -f "${PROJECT_DIR}/docs/RELEASE_NOTES.md" ] && NEW=$(cat "${PROJECT_DIR}/docs/RELEASE_NOTES.md")
          # The browser version is named only while its site really serves the game.
          WEB=""
          if curl -sfL --max-time 20 -o web.html https://kabaddi-raid-beta.netlify.app/ && grep -qi "<title>Kabaddi Raid" web.html; then
            WEB="**iPhone, iPad or a computer**: play the web version at https://kabaddi-raid-beta.netlify.app (on a phone, turn it sideways; tap once to start the sound)."
          fi
          cat > notes.md <<EOF
          The latest beta of **Kabaddi Raid** (${VERSION}), built from \`${GITHUB_SHA::7}\` after the full test suite passed.

          **Android** (64-bit phones): tap \`kabaddi-raid-${VERSION}.apk\` under Assets below. When it has
          downloaded, open it; if Android asks, allow your browser or Files to install unknown apps. It installs over
          any earlier Kabaddi Raid beta and keeps your saves.

          ${WEB}

          ${NEW}

          This release is replaced by every new beta build: this page always has the newest one.
          EOF
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Kabaddi Raid ${VERSION} (latest beta)" --notes-file notes.md
          gh release view "$TAG"

      # The foundation pilot's own pre-release (never the beta's): for the owner to try before it is merged.
      - name: Publish the foundation pilot
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/kabaddi-foundation-pilot'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=kabaddi-foundation-pilot
          APK=${PROJECT_DIR}/build/kabaddi-raid-${VERSION}.apk
          cat > notes.md <<EOF
          **Foundation pilot** of Kabaddi Raid (${VERSION}), built from \`${GITHUB_SHA::7}\`: the raiders, defenders and
          officials on the World Stage Games shared rig with motion-capture running. Installs over the beta and keeps
          your saves (the same game); reinstall the beta to go back.
          EOF
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$APK" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Foundation pilot: Kabaddi Raid ${VERSION}" --notes-file notes.md
          gh release view "$TAG"
